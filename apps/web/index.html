<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      The page does not zoom: an installed app never scales like a web page under a pinch. Android Chrome and
      the installed PWA honour this meta; iOS Safari ignores user-scalable, so lib/no-page-zoom.ts and the
      root `touch-action` in index.css cover it. `viewport-fit=cover` lets the app paint under the notch and
      the home indicator, which the safe-area insets then pad back out of.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The status bar takes the app's own background, not the brand green. Updated live by ThemeColorSync. -->
    <meta name="theme-color" content="#14110e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="money" />
    <meta name="format-detection" content="telephone=no" />
    <title>money</title>

    <!--
      The theme, before the first paint. next-themes applies the class from an effect, and effects run after
      paint, so a light-theme reader would otherwise get a frame of the dark canvas (dark is the default).
      Duplicated rather than imported on purpose: no module can run before the first paint. The storage key
      is the ThemeProvider's `storageKey` in routes/__root.tsx; the two colours are --background in index.css.
    -->
    <script>
      (() => {
        let theme = "dark";
        try {
          const stored = localStorage.getItem("vite-ui-theme");
          if (stored === "light") theme = "light";
          else if (stored === "system")
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch {
          /* storage blocked: dark, the default */
        }
        const root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(theme);
        root.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#fdfbf7" : "#14110e");
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
