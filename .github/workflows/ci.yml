name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant — cancel it rather than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Match the `packageManager` field in package.json.
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # `@money/env/server` validates at import time, so anything that pulls it in needs these present.
      # They are throwaway CI values, not secrets: no server is started and no data is touched.
      - name: Type-check
        run: bun run check-types
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:3000

      - name: Lint + format check
        run: bunx biome ci .

      - name: Test
        run: bun test
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:3000

  # The image is what people actually run, so a broken Dockerfile is a broken release. Build only —
  # publishing stays manual (./publish.sh), and amd64 alone is enough to catch a build regression.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
