# money — one-machine self-host on Fly.io
#
# This file is the ENTIRE deployment. There is no source checkout, no fork, and no
# build: `[build] image` points at the published Docker Hub image, so Fly pulls it
# and boots it as-is. Self-hosters download just this file. See /money/docs.
#
#   fly apps create my-money
#   fly deploy --config fly.toml --app my-money --ha=false
#
# `--ha=false` is NOT optional — see the [mounts] note below.

app = "my-money"             # globally unique across all of Fly — pick your own
primary_region = "sin"       # pick one near you: fly platform regions

[build]
  # Pulled as-is; no build step runs. Pin to a commit SHA instead of `latest` to
  # freeze a known-good build: rohitkaushal7/money:<sha>
  image = "rohitkaushal7/money:latest"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  # BETTER_AUTH_URL is derived from $FLY_APP_NAME at boot (see entrypoint.sh), so
  # there is nothing to configure for a default *.fly.dev deploy. Override it here
  # only when serving from a custom domain:
  # BETTER_AUTH_URL = "https://money.example.com"

[http_service]
  internal_port = 3000
  force_https = true          # Fly terminates TLS, which is what the Secure +
                              # SameSite=None session cookies require.
  auto_start_machines = true  # Fly Proxy holds the request, boots the Machine,
  auto_stop_machines = "stop" # then forwards it — so idle costs nothing.
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

# Durable state: control.db, users/<uid>/{app.db, analytics.duckdb, raw/}, and the
# auto-generated auth-secret. Fly creates this volume on first deploy.
#
# EXACTLY ONE MACHINE. These are local SQLite files on a host-pinned volume; a
# second Machine would get its OWN empty volume and silently fork your ledger in
# two. Always deploy with `--ha=false`, and never `fly scale count > 1`.
[mounts]
  source = "money_data"
  destination = "/app/data"
  initial_size = "1gb"        # 1GB is Fly's minimum — about $0.15/month

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"              # 512mb is tight once DuckDB rebuilds; with
                              # auto-stop you only pay for this while it runs.

# Startup applies SQLite migrations before serving, so allow some grace.
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"
